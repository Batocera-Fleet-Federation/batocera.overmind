name: Deploy Lambda

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-lambda-prod
  cancel-in-progress: false

env:
  AWS_REGION: us-east-1
  PROJECT_NAME: bff-overmind
  ENVIRONMENT: prod
  ECR_REPO: batocera-overmind
  TAG: lambda-latest

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN || secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Build and publish Lambda image
        run: scripts/docker-publish-lambda-ecr.sh

      - name: Update Lambda functions
        run: scripts/update-lambda-functions.sh
