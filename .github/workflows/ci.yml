name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  packages: write

jobs:
  # test:
  #   runs-on: ubuntu-latest
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-python@v5
  #       with:
  #         python-version: "3.11"
  #     - name: Install dependencies
  #       run: pip install -r requirements.txt pytest
  #     - name: Run tests
  #       run: PYTHONPATH=src pytest -q

  image:
    runs-on: ubuntu-latest
    # needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Configure AWS credentials for ECR
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION || env.AWS_REGION }}
      - name: Build image
        run: ./scripts/docker-publish.sh ${{ github.event_name == 'push' && '--push' || '--dry-run' }}
      - name: Push image to AWS ECR
        if: github.event_name == 'push'
        run: |
          export TAG=${{ github.sha }}
          export AWS_REGION=${{ secrets.AWS_DEFAULT_REGION || env.AWS_REGION }}
          ./scripts/docker-publish-ecr.sh
