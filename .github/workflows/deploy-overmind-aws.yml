name: Deploy Overmind to AWS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "pyproject.toml"
      - "src/**"
      - "app/**"
      - ".github/workflows/deploy-overmind-aws.yml"

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY || 'batocera-overmind' }}
  OVERMIND_ENVIRONMENT: ${{ vars.OVERMIND_ENVIRONMENT || 'prod' }}
  OVERMIND_PROJECT_NAME: ${{ vars.OVERMIND_PROJECT_NAME || 'bff-overmind' }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Overmind
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}

      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Overmind image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest

      - name: Locate Overmind instance
        id: instance
        run: |
          INSTANCE_ID="$(aws ec2 describe-instances \
            --filters \
              "Name=tag:Project,Values=${OVERMIND_PROJECT_NAME}" \
              "Name=tag:Environment,Values=${OVERMIND_ENVIRONMENT}" \
              "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text | awk '{print $1}')"
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "No running Overmind instance found for Project=${OVERMIND_PROJECT_NAME} Environment=${OVERMIND_ENVIRONMENT}" >&2
            exit 1
          fi
          echo "id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"

      - name: Deploy image through SSM
        id: deploy
        run: |
          IMAGE="${{ steps.ecr.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA}"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "${{ steps.instance.outputs.id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy Overmind ${GITHUB_SHA}" \
            --parameters commands="[\"sudo /opt/overmind/deploy.sh ${IMAGE}\"]" \
            --query "Command.CommandId" \
            --output text)"
          echo "command_id=$COMMAND_ID" >> "$GITHUB_OUTPUT"

      - name: Wait for SSM deployment
        run: |
          aws ssm wait command-executed \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.id }}"
          aws ssm get-command-invocation \
            --command-id "${{ steps.deploy.outputs.command_id }}" \
            --instance-id "${{ steps.instance.outputs.id }}" \
            --query '{Status:Status,Stdout:StandardOutputContent,Stderr:StandardErrorContent}' \
            --output json
